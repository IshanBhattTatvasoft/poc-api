service: poc-serverless-typescript

plugins:
  - serverless-offline
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 30
  region: eu-west-1
  environment:
    NODE_ENV: development
  stage: ${opt:stage, 'dev'}
  apiGateway:
    restApiId: 28ivb3d4wd
    restApiRootResourceId: g6rv8zq0uc  

# custom:
#   version: v1
#   serverless-offline:
#     httpPort: 3000
#   esbuild:
#     minify: true
#     exclude: []
#     watch:
#       pattern: ["./**/*.ts"]

functions:
  api:
    handler: handler.handler
    events:
      - http:
          path: /get-all-users
          method: get
          cors: true
      - http:
          path: /get-tasks-by-username
          method: post
          cors: true
      - http:
          path: /add-user
          method: post
          cors: true
      - http:
          path: /add-task
          method: post
          cors: true
      - http:
          path: /get-single-task
          method: post
          cors: true
      - http:
          path: /get-single-user
          method: post
          cors: true
      - http:
          path: /get-all-tasks
          method: get
          cors: true
      - http:
          path: /update-user/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
          cors: true
      - http:
          path: /update-task/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
          cors: true
      - http:
          path: /delete-task/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
          cors: true
      - http:
          path: /delete-user/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
          cors: true